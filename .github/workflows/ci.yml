# CI workflow for futbolautomate
#
# Runs lint checks and unit tests on every push/PR to main.
# Integration tests are excluded — they require a live PostgreSQL database
# and secrets that are not available in this environment.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      # 1. Check out the repository at the commit that triggered the workflow.
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. Install the exact Python version the project targets (>=3.11).
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 3. Cache the pip download cache keyed on pyproject.toml so that
      #    dependency downloads are skipped when nothing has changed.
      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install the project in editable mode together with the [dev] extras
      #    and the pinned tool versions used for linting and testing.
      #    ruff>=0.9 and mypy>=1.15 match the versions declared in pyproject.toml.
      #    mypy is run in progressive mode on core + db modules (see step 7 below).
      - name: Install dev dependencies
        run: pip install -e ".[dev]" ruff mypy pytest-cov

      # 5. Run ruff in lint mode over the application source tree.
      #    --output-format=github annotates PRs with inline error comments.
      #    The step fails if ruff reports any violations.
      - name: Lint with ruff
        run: ruff check app/ --output-format=github

      # 6. Verify that all source files are already formatted according to
      #    ruff's formatter rules.  --check exits non-zero (failing the step)
      #    if any file would be reformatted.
      - name: Format check with ruff
        run: ruff format app/ --check

      # 7. Run mypy in progressive mode over the most type-safe modules only.
      #    Scope: app/core/ (pure Python / Pydantic models, all well-typed) and
      #    app/db/base.py + app/db/models.py (SQLAlchemy 2.0 Mapped[] columns).
      #    --ignore-missing-imports avoids stub-package errors for third-party libs.
      #    --strict is intentionally omitted — the goal is catching regressions, not
      #    enforcing full strict mode across the whole codebase at once.
      #    Excluded from scope: app/pipelines/, app/presenters/, app/normalizers/,
      #    app/channels/, app/llm/ — these require broader annotation work first.
      - name: Type check (core + db models)
        run: mypy app/core/ app/db/models.py app/db/base.py --ignore-missing-imports

      # 8. Validate internal consistency of the JSON config files before running
      #    tests.  The script is pure stdlib — no database or secrets required.
      - name: Validate config files
        run: python scripts/validate_config.py

      # 9. Execute only the unit test suite.
      #    -q        — quiet output (dots instead of test names)
      #    --tb=short — show compact tracebacks on failure
      #    Integration tests under tests/integration/ are intentionally skipped
      #    because they require a running PostgreSQL instance and .env secrets.
      - name: Run unit tests
        run: pytest tests/unit/ -q --tb=short --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      # 10. Append a Markdown coverage table to the GitHub Actions job summary.
      #     Runs even if the test step fails so partial coverage is still visible.
      - name: Coverage summary
        if: always()
        run: |
          python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
