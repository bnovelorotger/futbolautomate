[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futbol-balear-scraper"
version = "0.1.0"
description = "Scraping y normalización modular de fútbol balear."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.15,<2.0",
  "beautifulsoup4>=4.12,<5.0",
  "Jinja2>=3.1,<4.0",
  "playwright>=1.52,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.9,<3.0",
  "python-dateutil>=2.9,<3.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.32,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "typer>=0.16,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.15,<2.0",
  "pre-commit>=4.0,<5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "real_telegram: opt out of the autouse Telegram blocker (tests that exercise TelegramNotificationService internals)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
exclude = ["migrations/", "tests/", ".venv/"]

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "*/tests/*", "*/.venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
